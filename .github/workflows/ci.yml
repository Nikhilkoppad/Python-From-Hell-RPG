name: Python From Hell CI — release gate
# Runs against the formatter-normalized source committed on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: npm run build
