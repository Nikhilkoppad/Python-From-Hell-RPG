name: Format source

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.prettierrc.json'
      - '.github/workflows/format.yml'

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: format source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npm run format

      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Source is already formatted.'
            exit 0
          fi
          git add src
          git commit -m 'chore: format source'
          git push
